# Publishes the npm package that dist built, using npm trusted publishing
# (OIDC) instead of a token. Called by release.yml, which dist generates
# from `publish-jobs = ["./publish-npm"]` in dist-workspace.toml; the
# caller grants `id-token: write` and npm checks the caller's filename
# (release.yml) against the trusted publisher configured on npmjs.com.
name: publish-npm

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - name: Fetch npm packages
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: npm/
          merge-multiple: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm supports trusted publishing (11.5.1 or later)
        run: |
          npm install -g npm@latest
          npm --version
      - name: Publish with OIDC
        run: |
          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith("-npm-package.tar.gz")] | any)'); do
            pkg=$(echo "$release" | jq '.artifacts[] | select(endswith("-npm-package.tar.gz"))' --raw-output)
            npm publish --access public "./npm/${pkg}"
          done
