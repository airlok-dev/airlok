[workspace]
resolver = "2"
members = ["crates/cli", "crates/core", "crates/llm", "tests"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/airlok-dev/airlok"
homepage = "https://airlok.dev"

[workspace.dependencies]
airlok-core = { path = "crates/core", version = "0.3.1" }
airlok-llm = { path = "crates/llm", version = "0.3.1" }

anyhow = "1.0.98"
async-trait = "0.1.88"
clap = { version = "4.5.40", features = ["derive"] }
futures = "0.3.31"
globset = "0.4.20"
grep = "0.4.1"
ignore = "0.4.33"
libc = "0.2.172"
regex = "1.11.1"
rustyline = { version = "18.0.1", default-features = false }
reqwest = { version = "0.12.20", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
similar = "3.2.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
termimad = "0.35.4"
thiserror = "2.0.12"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
toml = "1.1.6"
tokio = { version = "1.45.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
