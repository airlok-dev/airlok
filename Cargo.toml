[workspace]
resolver = "2"
members = ["crates/cli", "crates/core", "crates/llm", "tests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/airlok-dev/airlok"
homepage = "https://airlok.dev"

[workspace.dependencies]
airlok-core = { path = "crates/core", version = "0.1.0" }
airlok-llm = { path = "crates/llm", version = "0.1.0" }

anyhow = "1.0.98"
async-trait = "0.1.88"
clap = { version = "4.5.40", features = ["derive"] }
futures = "0.3.31"
regex = "1.11.1"
reqwest = { version = "0.12.20", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
